<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Morjene Market</title>
<meta name="description" content="Pâte à tartiner artisanale suisse — commande en ligne.">
<meta name="theme-color" content="#C4571A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El Morjene">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Nunito:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- 1) Détecte l'appareil (smartphone / tablette / PC) -->
<script src="js/device-detect.js"></script>

<!-- 2) Choisit l'affichage : smartphone = version mobile, tablette et PC = version bureau.
        Pour tester : ajoute ?view=mobile ou ?view=desktop à la fin de l'adresse. -->
<script>
(function () {
  var h = document.documentElement;
  var forced = (location.search.match(/[?&]view=(mobile|desktop)/) || [])[1];
  var view = forced || (h.getAttribute('data-device') === 'mobile' ? 'mobile' : 'desktop');
  h.setAttribute('data-view', view);
  document.write('<link rel="stylesheet" href="css/' + view + '.css">');
  if (view === 'mobile') {
    document.write('<link rel="stylesheet" href="css/mobile-polish.css">');
    // Thème clair/sombre : choix mémorisé, sinon réglage du téléphone (avant l'affichage, pour éviter un flash blanc)
    var pref = null; try { pref = JSON.parse(localStorage.getItem('em-theme')); } catch (e) {}
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    h.setAttribute('data-theme', dark ? 'dark' : 'light');
    var tc = document.querySelector('meta[name="theme-color"]'); if (tc && dark) tc.setAttribute('content', '#1A110B');
  }
})();
</script>
<link rel="stylesheet" href="css/device.css">
</head>
<body>
<div id="app"></div>

<!-- 3) Charge le bon code selon l'affichage choisi -->
<script>
(function () {
  var view = document.documentElement.getAttribute('data-view');
  if (view === 'mobile') document.write('<script src="js/mobile-polish.js"><\/script>');
  document.write('<script src="js/' + (view === 'mobile' ? 'app-mobile' : 'app') + '.js"><\/script>');
})();
</script>
<script src="js/version.js"></script>
<script src="js/updater.js"></script>
<script src="js/install.js"></script>
<script>
// Dans l'appli Android, les fichiers sont déjà dans l'APK : pas de service worker (il garderait d'anciennes versions)
if ('serviceWorker' in navigator && !window.Capacitor && !/; wv\)/.test(navigator.userAgent)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>
