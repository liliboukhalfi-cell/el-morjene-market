name: Fabriquer l'APK Android

# Se lance quand tu publies une "Release" sur GitHub (Releases > Draft a new release),
# ou à la main (Actions > Fabriquer l'APK Android > Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex : 1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier le numéro de version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La version doit ressembler à 1.0.0 (reçu : $TAG)"; exit 1
          fi
          IFS=. read -r MA MI PA <<< "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérifier que la clé de signature est configurée
        env:
          K1: ${{ secrets.KEYSTORE_BASE64 }}
          K2: ${{ secrets.KEYSTORE_PASSWORD }}
          K3: ${{ secrets.KEY_ALIAS }}
        run: |
          for n in K1 K2 K3; do
            if [ -z "${!n}" ]; then echo "::error::Il manque un secret (KEYSTORE_BASE64, KEYSTORE_PASSWORD ou KEY_ALIAS)."; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer les fichiers de l'appli (www)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir www
          cp -r index.html css js icons uploads manifest.webmanifest www/
          rm -f www/js/version.js
          echo "window.APP_VERSION = '$VERSION';" > www/js/version.js
          # Règles de sécurité dans l'appli : seuls le code de l'appli, les polices Google, FormSubmit et GitHub sont autorisés
          python3 - <<'PY'
          p = "www/index.html"
          s = open(p, encoding="utf-8").read()
          csp = ("default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
                 "font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://formsubmit.co https://api.github.com; "
                 "object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co")
          meta = '<meta http-equiv="Content-Security-Policy" content="%s">' % csp
          assert "<head>" in s
          open(p, "w", encoding="utf-8").write(s.replace("<head>", "<head>\n" + meta, 1))
          PY

      - name: Installer Capacitor
        run: npm ci --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Appliquer le nom, la version, les icônes et la sécurité
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CODE: ${{ steps.v.outputs.code }}
        run: |
          cp -r android-res/. android/app/src/main/res/
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n "allowBackup" android/app/src/main/AndroidManifest.xml

      - name: Fabriquer l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Signer l'APK avec ta clé
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "APK non signé : $UNSIGNED"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "out/El-Morjene-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
          "$BT/apksigner" verify --print-certs "out/El-Morjene-$VERSION.apk"
          (cd out && sha256sum "El-Morjene-$VERSION.apk" > "El-Morjene-$VERSION.apk.sha256" && cat "El-Morjene-$VERSION.apk.sha256")

      - name: Publier l'APK dans la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "El Morjene $TAG" --notes "Nouvelle version de l'appli."
          fi
